name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake autopoint libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev cmake make gcc g++ patch wget lbzip2 ccache

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36"
          python -m pip install buildozer

      - name: Pre-setup Buildozer SDK & Licenses
        run: |
          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"

          # 1. Buat direktori SDK untuk Buildozer
          mkdir -p "$BUILDOZER_SDK/licenses"
          mkdir -p "$BUILDOZER_SDK/cmdline-tools"

          # 2. Salin cmdline-tools (berisi sdkmanager asli) dari SDK bawaan runner
          if [ -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            cp -r "$ANDROID_HOME/cmdline-tools/latest" "$BUILDOZER_SDK/cmdline-tools/latest"
          fi

          # 3. Buat symlink kompatibilitas path lama (tools/bin/sdkmanager)
          #    karena python-for-android mencari sdkmanager di path lama ini
          ln -sfn "$BUILDOZER_SDK/cmdline-tools/latest" "$BUILDOZER_SDK/tools"

          # 4. Salin lisensi resmi dari runner Ubuntu
          if [ -d "$ANDROID_HOME/licenses" ]; then
            cp -r "$ANDROID_HOME/licenses/"* "$BUILDOZER_SDK/licenses/"
          fi

          # 5. Setujui lisensi menggunakan sdkmanager yang baru disalin
          yes | "$BUILDOZER_SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$BUILDOZER_SDK" --licenses || true

          # 6. Pasang platform-tools dan build-tools (samakan dengan buildozer.spec: 33.0.0)
          "$BUILDOZER_SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$BUILDOZER_SDK" "platform-tools" "platforms;android-33" "build-tools;33.0.0" || true

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkKnight-APK
          path: bin/*.apk
          if-no-files-found: error
