name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake autopoint libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev cmake make gcc g++ patch wget lbzip2 ccache

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36"
          python -m pip install git+https://github.com/kivy/buildozer.git@master

      - name: Setup Android SDK Tools Structure
        run: |
          # Buat folder SDK Buildozer
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
          cd ~/.buildozer/android/platform/android-sdk/cmdline-tools
          
          # Unduh commandlinetools resmi
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9441913_latest.zip
          unzip -q commandlinetools-linux-9441913_latest.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-9441913_latest.zip
          
          # Buat link symlink ke tools/bin agar sesuai ekspektasi Buildozer
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools
          ln -s ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin ~/.buildozer/android/platform/android-sdk/tools/bin
          
          # Setujui lisensi
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkKnight-APK
          path: bin/*.apk
          if-no-files-found: error
